<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="../public/sona-icon.png">
  <title>Sona Alive - Motion Study</title>
  <style>
    @property --rim-angle {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }

    :root {
      --aqua: #66e8ef;
      --blue: #75a8ff;
      --violet: #ad8aff;
      --pink: #ff87ce;
      --amber: #ffd278;
      --green: #70e0b5;
      --ink: #111317;
      --panel: rgba(27, 30, 36, 0.78);
      --text: #f6f7fa;
      --muted: #9da4b2;
      --speed: 1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      min-height: 100vh;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 43%, rgba(93, 106, 126, 0.17), transparent 38%),
        linear-gradient(145deg, #181a1f 0%, #0f1114 52%, #151619 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      opacity: 0.16;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    main {
      position: relative;
      display: grid;
      place-items: center;
      width: 100%;
      min-height: 100vh;
      padding: 32px;
      isolation: isolate;
    }

    .eyebrow {
      position: fixed;
      top: 28px;
      left: 32px;
      margin: 0;
      color: #c6cad3;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow span {
      color: var(--aqua);
    }

    .scene {
      position: relative;
      display: grid;
      place-items: center;
      width: min(78vw, 620px);
      aspect-ratio: 1;
      perspective: 1100px;
    }

    .atmosphere,
    .presence,
    .icon-shell,
    .orbit,
    .echo,
    .listening-field,
    .thought-system {
      position: absolute;
      inset: 50%;
      translate: -50% -50%;
    }

    .atmosphere {
      width: 72%;
      height: 72%;
      border-radius: 50%;
      opacity: 0.46;
      background: conic-gradient(
        from 40deg,
        rgba(102, 232, 239, 0.22),
        rgba(117, 168, 255, 0.06),
        rgba(255, 135, 206, 0.18),
        rgba(255, 210, 120, 0.08),
        rgba(102, 232, 239, 0.22)
      );
      filter: blur(52px);
      animation: atmosphere-spin calc(18s / var(--speed)) linear infinite;
    }

    .presence {
      width: 52%;
      height: 52%;
      border: 1px solid rgba(183, 205, 255, 0.22);
      border-radius: 50%;
      opacity: 0;
      animation: presence-pulse calc(6.4s / var(--speed)) ease-out infinite;
    }

    .presence + .presence {
      animation-delay: calc(-3.2s / var(--speed));
    }

    .icon-shell {
      width: 52%;
      min-width: 210px;
      max-width: 340px;
      aspect-ratio: 1;
      border: 0;
      padding: 0;
      cursor: pointer;
      background: transparent;
      transform-style: preserve-3d;
      animation: breathe calc(5.4s / var(--speed)) ease-in-out infinite;
      outline: none;
      will-change: transform;
    }

    .icon-shell:focus-visible {
      outline: 2px solid var(--aqua);
      outline-offset: 10px;
    }

    .icon-shell::before {
      position: absolute;
      z-index: -1;
      inset: 16% 12% 12%;
      border-radius: 46%;
      content: "";
      background: linear-gradient(135deg, rgba(102, 232, 239, 0.8), rgba(117, 168, 255, 0.45) 40%, rgba(255, 135, 206, 0.7));
      filter: blur(44px);
      opacity: 0.3;
      transform: translateZ(-20px) scale(0.96);
      animation: aura calc(5.4s / var(--speed)) ease-in-out infinite;
    }

    .icon-face {
      position: absolute;
      inset: 0;
      overflow: visible;
      filter: drop-shadow(0 34px 34px rgba(0, 0, 0, 0.42));
      transform: translateZ(30px) rotateX(var(--tilt-y, 0deg)) rotateY(var(--tilt-x, 0deg));
      transition: transform 140ms ease-out;
    }

    .icon-image,
    .refraction {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }

    .icon-image {
      animation: color-breathe calc(5.4s / var(--speed)) ease-in-out infinite;
    }

    .refraction {
      opacity: 0.24;
      mix-blend-mode: screen;
      filter: saturate(1.35) contrast(1.05);
      clip-path: polygon(0 41%, 100% 29%, 100% 49%, 0 60%);
      animation: refraction calc(4.2s / var(--speed)) ease-in-out infinite;
    }

    .glass-light {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.64;
      background: linear-gradient(
        108deg,
        transparent 30%,
        rgba(255, 255, 255, 0.08) 39%,
        rgba(255, 255, 255, 0.78) 47%,
        rgba(121, 225, 255, 0.32) 53%,
        transparent 62%
      );
      -webkit-mask: url("./sona-transparent.png") center / contain no-repeat;
      mask: url("./sona-transparent.png") center / contain no-repeat;
      mix-blend-mode: screen;
      transform: translateX(-95%);
      animation: glass-sweep calc(6.2s / var(--speed)) cubic-bezier(0.55, 0, 0.25, 1) infinite;
    }

    .rim {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: conic-gradient(
        from var(--rim-angle, 0deg),
        rgba(102, 232, 239, 0.12),
        rgba(255, 255, 255, 0.64),
        rgba(255, 135, 206, 0.2),
        rgba(255, 210, 120, 0.5),
        rgba(102, 232, 239, 0.12)
      );
      -webkit-mask: url("./sona-transparent.png") center / contain no-repeat;
      mask: url("./sona-transparent.png") center / contain no-repeat;
      mix-blend-mode: screen;
      animation: rim-spin calc(5.8s / var(--speed)) linear infinite;
    }

    .orbit {
      width: 66%;
      height: 55%;
      border: 1px dashed rgba(255, 210, 120, 0.38);
      border-radius: 50%;
      opacity: 0;
      animation: orbit calc(9s / var(--speed)) linear infinite;
    }

    .spark {
      position: absolute;
      top: 4%;
      left: 49%;
      width: 13px;
      height: 13px;
      border: 0;
      border-radius: 50%;
      background: #fff4cf;
      box-shadow:
        0 0 0 4px rgba(255, 210, 120, 0.12),
        0 0 18px 7px rgba(255, 210, 120, 0.45),
        0 0 38px 14px rgba(255, 148, 196, 0.14);
      transform: rotate(45deg);
      animation: spark-pop calc(2.2s / var(--speed)) ease-in-out infinite;
    }

    .spark::before,
    .spark::after {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 999px;
      content: "";
      translate: -50% -50%;
      background: #fff8df;
    }

    .spark::before {
      width: 3px;
      height: 28px;
    }

    .spark::after {
      width: 28px;
      height: 3px;
    }

    .echo {
      width: 52%;
      height: 52%;
      border: 1px solid rgba(112, 224, 181, 0.48);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .listening-field {
      width: 76%;
      height: 62%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }

    .listen-arc {
      position: absolute;
      top: 50%;
      width: 20%;
      height: var(--arc-height);
      border-radius: 50%;
      opacity: 0;
      translate: 0 -50%;
      animation: listen-wave 1.75s ease-in-out infinite;
    }

    .listen-arc.left {
      left: 0;
      border-left: 2px solid rgba(112, 224, 181, 0.88);
    }

    .listen-arc.right {
      right: 0;
      border-right: 2px solid rgba(102, 232, 239, 0.88);
    }

    .listen-arc.near {
      --arc-height: 42%;
      animation-delay: -0.2s;
    }

    .listen-arc.mid {
      --arc-height: 68%;
      animation-delay: -0.55s;
    }

    .listen-arc.far {
      --arc-height: 92%;
      animation-delay: -0.9s;
    }

    .listen-arc.left.near { left: 13%; }
    .listen-arc.left.mid { left: 6%; }
    .listen-arc.right.near { right: 13%; }
    .listen-arc.right.mid { right: 6%; }

    .thought-system {
      width: 72%;
      height: 72%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
      animation: thought-tilt 3.2s ease-in-out infinite;
    }

    .thought-ring {
      position: absolute;
      inset: 8%;
      border: 1px solid rgba(255, 210, 120, 0.34);
      border-radius: 50%;
      transform: rotate(-18deg) scaleY(0.78);
    }

    .thought-ring.inner {
      inset: 17%;
      border-color: rgba(255, 135, 206, 0.32);
      border-style: dashed;
      transform: rotate(26deg) scaleY(0.74);
      animation: counter-orbit 5s linear infinite;
    }

    .thought-node {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 16px 4px rgba(255, 210, 120, 0.46);
      animation: thought-node 1.1s ease-in-out infinite alternate;
    }

    .thought-node.one { top: 16%; left: 18%; }
    .thought-node.two { top: 26%; right: 10%; animation-delay: -0.35s; background: var(--pink); }
    .thought-node.three { right: 24%; bottom: 11%; animation-delay: -0.72s; background: var(--aqua); }

    .status {
      position: fixed;
      bottom: 32px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(18px);
      translate: -50% 0;
    }

    .status button {
      min-width: 84px;
      height: 36px;
      border: 0;
      border-radius: 5px;
      padding: 0 14px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      transition: color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    .status button:hover {
      color: var(--text);
    }

    .status button:focus-visible {
      outline: 2px solid var(--aqua);
      outline-offset: 1px;
    }

    .status button[aria-pressed="true"] {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .state-idle .atmosphere {
      opacity: 0.28;
      filter: blur(62px);
      animation-duration: 24s;
    }

    .state-idle .presence {
      animation-name: idle-presence;
    }

    .state-idle .glass-light {
      animation-duration: 8.4s;
    }

    .state-idle .status button[aria-pressed="true"] {
      box-shadow: inset 0 -2px 0 rgba(117, 168, 255, 0.9);
    }

    .state-listening {
      --speed: 1.35;
    }

    .state-listening .atmosphere {
      background: conic-gradient(from 40deg, rgba(112, 224, 181, 0.34), rgba(102, 232, 239, 0.08), rgba(117, 168, 255, 0.2), rgba(112, 224, 181, 0.34));
    }

    .state-listening .presence {
      border-color: rgba(112, 224, 181, 0.46);
      border-radius: 50%;
      animation-duration: 2.2s;
    }

    .state-listening .echo {
      animation: sonar calc(2.4s / var(--speed)) ease-out infinite;
    }

    .state-listening .echo + .echo {
      animation-delay: calc(-1.2s / var(--speed));
    }

    .state-listening .listening-field {
      opacity: 1;
    }

    .state-listening .icon-shell {
      animation-name: listening-breathe;
      animation-duration: 1.65s;
    }

    .state-listening .icon-shell::before {
      background: linear-gradient(135deg, rgba(112, 224, 181, 0.82), rgba(102, 232, 239, 0.48) 55%, rgba(117, 168, 255, 0.42));
      opacity: 0.48;
    }

    .state-listening .status button[aria-pressed="true"] {
      color: #dbfff2;
      background: rgba(112, 224, 181, 0.12);
      box-shadow: inset 0 -2px 0 rgba(112, 224, 181, 0.9);
    }

    .state-thinking {
      --speed: 1.9;
    }

    .state-thinking .orbit {
      opacity: 1;
      animation-duration: 5.6s;
    }

    .state-thinking .spark {
      background: #fff;
      box-shadow: 0 0 18px 7px rgba(255, 210, 120, 0.58), 0 0 38px 14px rgba(255, 135, 206, 0.22);
    }

    .state-thinking .icon-shell::before {
      background: linear-gradient(135deg, rgba(102, 232, 239, 0.64), rgba(255, 135, 206, 0.6) 52%, rgba(255, 210, 120, 0.58));
      opacity: 0.62;
    }

    .state-thinking .presence {
      animation: none;
    }

    .state-thinking .thought-system,
    .state-thinking .rim {
      opacity: 1;
    }

    .state-thinking .icon-shell {
      animation-name: thinking-float;
      animation-duration: 2.1s;
    }

    .state-thinking .refraction {
      opacity: 0.48;
      animation-duration: 1.6s;
    }

    .state-thinking .glass-light {
      animation-duration: 2.5s;
    }

    .state-thinking .atmosphere {
      opacity: 0.64;
      background: conic-gradient(from 40deg, rgba(102, 232, 239, 0.22), rgba(255, 135, 206, 0.3), rgba(255, 210, 120, 0.22), rgba(117, 168, 255, 0.18), rgba(102, 232, 239, 0.22));
    }

    .state-thinking .status button[aria-pressed="true"] {
      color: #fff4d5;
      background: rgba(255, 210, 120, 0.11);
      box-shadow: inset 0 -2px 0 rgba(255, 210, 120, 0.9);
    }

    @keyframes atmosphere-spin {
      to { rotate: 360deg; }
    }

    @keyframes presence-pulse {
      0% { opacity: 0; scale: 0.84; }
      28% { opacity: 0.45; }
      100% { opacity: 0; scale: 1.18; }
    }

    @keyframes idle-presence {
      0%, 100% { opacity: 0.04; scale: 0.94; }
      50% { opacity: 0.18; scale: 1.06; }
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) rotateX(0deg) rotateY(0deg) scale(1); }
      50% { transform: translateY(-10px) rotateX(1deg) rotateY(-1deg) scale(1.018); }
    }

    @keyframes listening-breathe {
      0%, 100% { transform: translateY(0) scale(0.99); }
      45% { transform: translateY(-4px) scale(1.035); }
      62% { transform: translateY(-2px) scale(1.012); }
    }

    @keyframes thinking-float {
      0%, 100% { transform: translateY(0) rotate(-1.6deg) scale(1); }
      50% { transform: translateY(-8px) rotate(2deg) scale(1.025); }
    }

    @keyframes aura {
      0%, 100% { opacity: 0.28; scale: 0.94; }
      50% { opacity: 0.46; scale: 1.04; }
    }

    @keyframes color-breathe {
      0%, 100% { filter: saturate(1.02) brightness(1); }
      50% { filter: saturate(1.16) brightness(1.045); }
    }

    @keyframes refraction {
      0%, 100% { translate: -2% -1%; }
      50% { translate: 3% 2%; }
    }

    @keyframes glass-sweep {
      0%, 15% { transform: translateX(-95%); opacity: 0; }
      31% { opacity: 0.75; }
      49%, 100% { transform: translateX(95%); opacity: 0; }
    }

    @keyframes rim-spin {
      to { --rim-angle: 360deg; }
    }

    @keyframes orbit {
      to { rotate: 360deg; }
    }

    @keyframes spark-pop {
      0%, 100% { scale: 0.74; opacity: 0.72; }
      50% { scale: 1.08; opacity: 1; }
    }

    @keyframes sonar {
      0% { opacity: 0.55; scale: 0.92; }
      100% { opacity: 0; scale: 1.48; }
    }

    @keyframes listen-wave {
      0%, 100% { opacity: 0.16; transform: scale(0.9); }
      45% { opacity: 0.9; transform: scale(1.04); }
      70% { opacity: 0.42; transform: scale(0.97); }
    }

    @keyframes thought-tilt {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(4deg); }
    }

    @keyframes counter-orbit {
      to { rotate: -360deg; }
    }

    @keyframes thought-node {
      from { opacity: 0.52; scale: 0.7; }
      to { opacity: 1; scale: 1.28; }
    }

    @media (max-width: 600px) {
      main {
        padding: 20px;
      }

      .eyebrow {
        top: 20px;
        left: 20px;
      }

      .scene {
        width: min(112vw, 540px);
      }

      .icon-shell {
        min-width: 176px;
      }

      .status {
        bottom: 20px;
      }

      .status button {
        min-width: 72px;
        padding: 0 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body class="state-idle">
  <main>
    <p class="eyebrow"><span>Sona</span> / living mark study</p>

    <section class="scene" aria-label="Animated Sona icon preview">
      <div class="atmosphere" aria-hidden="true"></div>
      <div class="presence" aria-hidden="true"></div>
      <div class="presence" aria-hidden="true"></div>
      <div class="echo" aria-hidden="true"></div>
      <div class="echo" aria-hidden="true"></div>

      <div class="listening-field" aria-hidden="true">
        <span class="listen-arc left near"></span>
        <span class="listen-arc left mid"></span>
        <span class="listen-arc left far"></span>
        <span class="listen-arc right near"></span>
        <span class="listen-arc right mid"></span>
        <span class="listen-arc right far"></span>
      </div>

      <div class="thought-system" aria-hidden="true">
        <span class="thought-ring"></span>
        <span class="thought-ring inner"></span>
        <span class="thought-node one"></span>
        <span class="thought-node two"></span>
        <span class="thought-node three"></span>
      </div>

      <div class="orbit" aria-hidden="true">
        <span class="spark"></span>
      </div>

      <button class="icon-shell" type="button" aria-label="Cycle Sona animation state">
        <span class="icon-face">
          <img class="icon-image" src="./sona-transparent.png" alt="">
          <img class="refraction" src="./sona-transparent.png" alt="" aria-hidden="true">
          <span class="glass-light" aria-hidden="true"></span>
          <span class="rim" aria-hidden="true"></span>
        </span>
      </button>
    </section>

    <nav class="status" aria-label="Sona animation states">
      <button type="button" data-state="idle" aria-pressed="true">Idle</button>
      <button type="button" data-state="listening" aria-pressed="false">Listening</button>
      <button type="button" data-state="thinking" aria-pressed="false">Thinking</button>
    </nav>
  </main>

  <script>
    const states = ['idle', 'listening', 'thinking'];
    const stateButtons = [...document.querySelectorAll('[data-state]')];
    const icon = document.querySelector('.icon-shell');
    let activeState = 'idle';
    let tiltFrame;

    function setState(state) {
      activeState = states.includes(state) ? state : 'idle';
      document.body.className = `state-${activeState}`;
      stateButtons.forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.state === activeState));
      });
    }

    stateButtons.forEach((button) => {
      button.addEventListener('click', () => setState(button.dataset.state));
    });

    icon.addEventListener('click', () => {
      const next = states[(states.indexOf(activeState) + 1) % states.length];
      setState(next);
    });

    document.addEventListener('pointermove', (event) => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      cancelAnimationFrame(tiltFrame);
      tiltFrame = requestAnimationFrame(() => {
        const x = (event.clientX / window.innerWidth - 0.5) * 7;
        const y = (event.clientY / window.innerHeight - 0.5) * -7;
        icon.style.setProperty('--tilt-x', `${x}deg`);
        icon.style.setProperty('--tilt-y', `${y}deg`);
      });
    });

    document.addEventListener('pointerleave', () => {
      icon.style.removeProperty('--tilt-x');
      icon.style.removeProperty('--tilt-y');
    });
  </script>
</body>
</html>
